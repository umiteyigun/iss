<div class="language-selector" (clickOutside)="closeDropdown()">
  <!-- Language Selector Button -->
  <button 
    type="button" 
    class="language-btn"
    (click)="toggleDropdown()"
    [attr.aria-expanded]="isDropdownOpen"
    aria-haspopup="true"
    [attr.aria-label]="'common.language' | translate">
    
    <span class="language-flag">{{ getCurrentLanguageInfo()?.flag || '🌐' }}</span>
    <span class="language-name">{{ getCurrentLanguageInfo()?.name || 'Language' }}</span>
    <i class="fas fa-chevron-down" [class.rotated]="isDropdownOpen"></i>
  </button>

  <!-- Language Dropdown -->
  <div 
    class="language-dropdown" 
    [class.show]="isDropdownOpen"
    role="menu"
    [attr.aria-label]="'common.select_language' | translate">
    
    <div class="dropdown-header">
      <i class="fas fa-globe"></i>
      <span>{{ 'common.select_language' | translate }}</span>
    </div>
    
    <div class="dropdown-content">
      <button 
        *ngFor="let language of availableLanguages"
        type="button"
        class="language-option"
        [class.active]="isLanguageActive(language.code)"
        (click)="onLanguageChange(language.code)"
        role="menuitem"
        [attr.aria-label]="('common.select_language' | translate) + ': ' + language.name">
        
        <span class="option-flag">{{ language.flag }}</span>
        <span class="option-name">{{ language.name }}</span>
        <i *ngIf="isLanguageActive(language.code)" class="fas fa-check option-check"></i>
      </button>
    </div>
  </div>
</div>
